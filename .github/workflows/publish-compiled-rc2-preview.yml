name: Publish compiled TakoTech RC2 preview

on:
  push:
    branches: [gtnh-2.9-rc2-port]

jobs:
  publish:
    # One-time publication of the known successful compilation. Do not
    # publish a stale JAR automatically after subsequent source changes.
    if: github.event.head_commit.message == 'Publish first GTNH 2.9 RC2 compile preview'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download successful build artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh run download 38907388960 \
            --repo "${GITHUB_REPOSITORY}" \
            --name "TakoTech-GTNH-2.9.0-RC2-UNTESTED" \
            --dir dist
          test -s dist/TakoTech-GTNH-2.9.0-RC2-UNTESTED.jar
          (cd dist && sha256sum -c SHA256SUMS.txt)
      - name: Publish direct JAR and SHA-256 checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="takotech-2.9-rc2-unverified-${GITHUB_SHA:0:7}"
          gh release create "$tag" \
            dist/TakoTech-GTNH-2.9.0-RC2-UNTESTED.jar \
            dist/SHA256SUMS.txt \
            --repo "${GITHUB_REPOSITORY}" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "TakoTech GTNH 2.9.0 RC2 (compile-tested only)" \
            --notes "UNVERIFIED TEST BUILD for Minecraft 1.7.10 / GTNH 2.9 RC2 / Java 25. Based on XSana/TakoTech GPL-3.0. AE2 API, dependency and saved-data lifecycle changes compile successfully; startup, world persistence, cell storage, and coremod Mixins have NOT been tested in-game. Back up your world and never test with valuable AE2 cell contents."
