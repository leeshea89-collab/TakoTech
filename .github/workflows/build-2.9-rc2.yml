name: TakoTech GTNH 2.9.0-RC2 compatibility preview

on:
  workflow_dispatch:
  push:
    branches: [gtnh-2.9-rc2-port]

concurrency:
  group: takotech-rc2-preview-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble TakoTech preview
        run: |
          chmod +x gradlew
          ./gradlew assemble --no-daemon --stacktrace
      - name: Prepare installable JAR
        run: |
          mkdir -p dist
          found=$(find build/libs -maxdepth 1 -name '*.jar' ! -name '*-dev.jar' ! -name '*-sources.jar' -print -quit)
          test -n "$found"
          cp "$found" dist/TakoTech-GTNH-2.9.0-RC2-UNTESTED.jar
          (cd dist && sha256sum *.jar > SHA256SUMS.txt)
      - name: Upload JAR and SHA-256
        uses: actions/upload-artifact@v4
        with:
          name: TakoTech-GTNH-2.9.0-RC2-UNTESTED
          path: dist/*
          if-no-files-found: error
